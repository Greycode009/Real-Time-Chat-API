<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --primary: #60a5fa;
        --primary-strong: #3b82f6;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        --shadow: rgba(15, 23, 42, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(
          135deg,
          #020817 0%,
          #0f172a 35%,
          #111827 100%
        );
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .chat-shell {
        width: min(92vw, 780px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 24px;
        box-shadow: 0 28px 60px var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(8px);
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 20px 22px;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.22),
          rgba(52, 211, 153, 0.12)
        );
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .chat-header h1 {
        margin: 0;
        font-size: clamp(1.3rem, 2vw, 2rem);
        letter-spacing: 0.04em;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.12);
        color: #a7f3d0;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .status.disconnected {
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
      }

      .status.disconnected .status-dot {
        background: var(--danger);
        box-shadow: 0 0 12px rgba(248, 113, 113, 0.8);
      }

      .room-panel {
        padding: 18px 20px 14px;
        background: rgba(15, 23, 42, 0.8);
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .room-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .room-controls label {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 700;
      }

      .room-input,
      .room-select,
      .message-input {
        flex: 1;
        min-width: 120px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.95rem;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .room-select {
        max-width: 160px;
      }

      .room-input:focus,
      .room-select:focus,
      .message-input:focus {
        border-color: rgba(96, 165, 250, 0.9);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
      }

      .room-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      .room-badge,
      .online-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.15);
        padding: 9px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .room-badge strong,
      .online-badge strong {
        color: var(--text);
      }

      .messages {
        min-height: 300px;
        max-height: 430px;
        overflow-y: auto;
        padding: 22px;
        background: rgba(15, 23, 42, 0.72);
      }

      .messages p {
        margin: 0 0 12px;
        padding: 12px 14px;
        background: rgba(31, 41, 55, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 14px;
        line-height: 1.45;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 18px 20px 20px;
        background: rgba(17, 24, 39, 0.92);
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          filter 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      #joinRoomButton,
      #sendButton {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-strong)
        );
        color: white;
      }

      #leaveButton {
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
        border: 1px solid rgba(248, 113, 113, 0.25);
        margin: 0 20px 20px;
        width: calc(100% - 40px);
      }

      @media (max-width: 640px) {
        .chat-shell {
          width: 95vw;
          border-radius: 18px;
        }

        .chat-header {
          padding: 16px 18px;
          align-items: flex-start;
        }

        .header-right {
          width: 100%;
          justify-content: flex-end;
        }

        .room-controls {
          flex-direction: column;
          align-items: stretch;
        }

        .room-select {
          max-width: none;
        }

        .composer {
          flex-direction: column;
        }

        #sendButton,
        #joinRoomButton {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <div class="chat-header">
        <h1>Socket.IO Chat</h1>
        <div class="header-right">
          <div id="connectionStatus" class="status disconnected">
            <span class="status-dot"></span>
            <span>Disconnected</span>
          </div>
        </div>
      </div>

      <div class="room-panel">
        <div class="room-controls">
          <label for="roomInput">Room</label>
          <input
            id="roomInput"
            class="room-input"
            type="text"
            value="developers"
            placeholder="Enter room name"
          />
          <select id="roomPreset" class="room-select">
            <option value="developers">developers</option>
            <option value="design">design</option>
            <option value="support">support</option>
            <option value="random">random</option>
          </select>
          <button id="joinRoomButton">Join Room</button>
        </div>

        <div class="room-meta">
          <div class="room-badge">
            Current room: <strong id="currentRoomLabel">None</strong>
          </div>
          <div class="online-badge">
            Online: <strong id="onlineUsers">0</strong>
          </div>
        </div>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer">
        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="Type a message..."
        />
        <button id="sendButton">Send</button>
      </div>

      <button id="leaveButton">Leave Room</button>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
      const socket = io("http://localhost:3000", {
        auth: {
          token:
           "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InRlc3QtdXNlci0xIiwidXNlcm5hbWUiOiJEaXBlc2giLCJpYXQiOjE3ODkzMTUwMTIsImV4cCI6MTc4OTMxODYxMn0.htfc9tjmLESn8Om8TroP2-RimCaKw4X464v5P-r6hIo",
        },
      });

      const roomInput = document.getElementById("roomInput");
      const roomPreset = document.getElementById("roomPreset");
      const joinRoomButton = document.getElementById("joinRoomButton");
      const currentRoomLabel = document.getElementById("currentRoomLabel");
      const connectionStatus = document.getElementById("connectionStatus");
      const onlineUsers = document.getElementById("onlineUsers");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const messages = document.getElementById("messages");
      const leaveButton = document.getElementById("leaveButton");

      let currentRoom = null;

      const updateConnectionStatus = (connected) => {
        if (connected) {
          connectionStatus.classList.remove("disconnected");
          connectionStatus.innerHTML =
            '<span class="status-dot"></span><span>Connected</span>';
        } else {
          connectionStatus.classList.add("disconnected");
          connectionStatus.innerHTML =
            '<span class="status-dot"></span><span>Disconnected</span>';
        }
      };

      const updateRoomLabel = (room) => {
        currentRoomLabel.textContent = room || "None";
      };

      const updateOnlineCount = (count) => {
        onlineUsers.textContent = Number(count || 0);
      };

      const clearMessages = () => {
        messages.innerHTML = "";
      };

      const addMessage = (message) => {
        const messageElement = document.createElement("p");
        messageElement.textContent =
          message && message.text ? message.text : String(message);

        messages.appendChild(messageElement);
        messages.scrollTop = messages.scrollHeight;
      };

      const joinRoom = (roomName) => {
        const room = String(roomName || "").trim();

        if (!room) return;

        if (currentRoom && currentRoom !== room) {
          socket.emit("room:leave", currentRoom);
        }

        currentRoom = room;
        roomInput.value = room;
        roomPreset.value = room;
        updateRoomLabel(room);
        clearMessages();

        socket.emit("room:join", room);
      };

      socket.on("connect", () => {
        console.log("Connected to server");
        updateConnectionStatus(true);

        const defaultRoom = roomInput.value.trim() || "developers";
        joinRoom(defaultRoom);
      });

      socket.on("disconnect", () => {
        console.log("Disconnected from server");
        updateConnectionStatus(false);
      });

      socket.on("connect_error", (error) => {
        console.error("Connection error:", error.message);
        updateConnectionStatus(false);
      });

      sendButton.addEventListener("click", () => {
        const message = messageInput.value.trim();

        if (!message || !currentRoom) return;

        socket.emit("message:send", { text: message, room: currentRoom });
        messageInput.value = "";
      });

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendButton.click();
        }
      });

      joinRoomButton.addEventListener("click", () => {
        joinRoom(roomInput.value);
      });

      roomPreset.addEventListener("change", (event) => {
        const selectedRoom = event.target.value;
        if (selectedRoom) {
          roomInput.value = selectedRoom;
          joinRoom(selectedRoom);
        }
      });

      socket.on("message:receive", (message) => {
        console.log("Message from server:", message);
        addMessage(message);
      });

      socket.on("message:history", (messageList) => {
        if (!Array.isArray(messageList)) return;

        messageList.forEach((message) => {
          addMessage(message);
        });
      });

      leaveButton.addEventListener("click", () => {
        if (!currentRoom) return;

        socket.emit("room:leave", currentRoom);
        currentRoom = null;
        updateRoomLabel("None");
        clearMessages();
      });

      socket.on("presence:update", (presence) => {
        if (!presence) return;
        updateOnlineCount(presence.onlineCount);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --primary: #60a5fa;
        --primary-strong: #3b82f6;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #34d399;
        --danger: #f87171;
        --shadow: rgba(15, 23, 42, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(
          135deg,
          #020817 0%,
          #0f172a 35%,
          #111827 100%
        );
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .chat-shell {
        width: min(92vw, 760px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 24px;
        box-shadow: 0 28px 60px var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(8px);
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.22),
          rgba(52, 211, 153, 0.12)
        );
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .chat-header h1 {
        margin: 0;
        font-size: clamp(1.4rem, 2vw, 2rem);
        letter-spacing: 0.04em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.12);
        color: #a7f3d0;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
      }

      .messages {
        min-height: 360px;
        max-height: 480px;
        overflow-y: auto;
        padding: 22px;
        background: rgba(15, 23, 42, 0.72);
      }

      .messages p {
        margin: 0 0 12px;
        padding: 12px 14px;
        background: rgba(31, 41, 55, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 14px;
        line-height: 1.45;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 18px 20px 20px;
        background: rgba(17, 24, 39, 0.92);
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      input {
        flex: 1;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input:focus {
        border-color: rgba(96, 165, 250, 0.9);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          filter 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      #sendButton {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-strong)
        );
        color: white;
        min-width: 100px;
      }

      #leaveButton {
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
        border: 1px solid rgba(248, 113, 113, 0.25);
        margin: 0 20px 20px;
        width: calc(100% - 40px);
      }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <div class="chat-header">
        <h1>Socket.IO Chat</h1>
        <div class="status"><span class="status-dot"></span> Live</div>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendButton">Send</button>
      </div>

      <button id="leaveButton">Leave Room</button>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
      const socket = io("http://localhost:3000");

      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const messages = document.getElementById("messages");

      let currentRoom = null;

      const addMessage = (message) => {
        const messageElement = document.createElement("p");
        messageElement.textContent =
          message && message.text ? message.text : String(message);

        messages.appendChild(messageElement);
      };

      socket.on("connect", () => {
        console.log("Connected to server");

        currentRoom = "developers";
        socket.emit("room:join", currentRoom);
      });

      sendButton.addEventListener("click", () => {
        const message = messageInput.value.trim();
        if (!message || !currentRoom) return;

        socket.emit("message:send", { text: message, room: currentRoom });

        messageInput.value = "";
      });

      socket.on("message:receive", (message) => {
        console.log("Message from server:", message);

        addMessage(message);
      });

      socket.on("message:history", (messages) => {
        messages.forEach((message) => {
          addMessage(message);
        });
      });
      
      const leaveButton = document.getElementById("leaveButton");

      leaveButton.addEventListener("click", () => {
        if (!currentRoom) return;
        socket.emit("room:leave", currentRoom);
      });
    </script>
  </body>
</html>

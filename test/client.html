<!doctype html>
<html>
  <head>
    <title>Socket Test</title>
  </head>
  <body>
    <h1>Socket.IO Chat</h1>

    <input type="text" id="messageInput" placeholder="Type a message" />
    <button id="sendButton">Send</button>

    <div id="messages"></div>
    <button id="leaveButton">Leave Room</button>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
      const socket = io("http://localhost:3000");

      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const messages = document.getElementById("messages");

      let currentRoom = null;

      socket.on("connect", () => {
        console.log("Connected to server");

        currentRoom = "developers";
        socket.emit("room:join", currentRoom);
      });

      sendButton.addEventListener("click", () => {
        const message = messageInput.value.trim();
        if (!message || !currentRoom) return;

        socket.emit("message:send", { text: message, room: currentRoom });

        messageInput.value = "";
      });

      socket.on("message:receive", (message) => {
        console.log("Message from server:", message);

        const messageElement = document.createElement("p");
        messageElement.textContent =
          message && message.text ? message.text : String(message);

        messages.appendChild(messageElement);
      });
      const leaveButton = document.getElementById("leaveButton");

      leaveButton.addEventListener("click", () => {
        if (!currentRoom) return;
        socket.emit("room:leave", currentRoom);
      });
    </script>
  </body>
</html>
